<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSU-A Campus Navigation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;padding:32px}
  .card{max-width:420px;text-align:center}
  h1{font-size:24px;font-weight:800;margin-bottom:8px}
  p{font-size:14px;color:#94a3b8;line-height:1.6;margin-bottom:24px}
  .links{display:flex;flex-direction:column;gap:12px}
  a{display:block;padding:16px 24px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;transition:transform .15s}
  a:active{transform:scale(.97)}
  .btn-ar{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff}
  .btn-qr{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="card">
  <h1>CSU-A Campus Navigation</h1>
  <p>Scan QR codes at campus buildings to get AR walking directions to any destination on campus.</p>
  <div class="links">
    <a class="btn-ar" href="ar_navigation.html">Open AR Navigation</a>
    <a class="btn-qr" href="qr_locations.html">Print QR Codes for Buildings</a>
  </div>
</div>
</body>
</html>
