<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSU-A Admin Panel</title>
<style>
:root{--blue:#1a56db;--blue-light:#3b82f6;--blue-dark:#1e40af;--green:#059669;--green-light:#10b981;--gold:#d97706;--red:#dc2626;--gray:#6b7280;--gray-light:#e5e7eb;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-sub:#64748b;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Login ── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px 32px;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo h1{font-size:20px;font-weight:800;color:var(--blue-dark)}
.login-logo p{font-size:13px;color:var(--text-sub);margin-top:4px}
.login-logo .icon{font-size:40px;margin-bottom:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--gray-light);border-radius:10px;font-size:14px;transition:border-color .2s;outline:none;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue-light)}
.form-group textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#047857}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-outline{background:transparent;border:1.5px solid var(--gray-light);color:var(--text)}.btn-outline:hover{background:var(--gray-light)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.btn-full{width:100%;justify-content:center}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:12px;display:none}

/* ── Dashboard ── */
.dashboard{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--gray-light);padding:12px 20px;display:flex;align-items:center;gap:12px}
.topbar-title{flex:1;font-size:16px;font-weight:800}
.topbar-role{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.role-superadmin{background:#fef3c7;color:#92400e}
.role-infra{background:#dbeafe;color:#1e40af}
.role-hr{background:#ede9fe;color:#5b21b6}
.topbar-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--gray-light);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.container{max-width:800px;margin:0 auto;padding:20px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-card .num{font-size:28px;font-weight:800}
.stat-card .lbl{font-size:11px;color:var(--text-sub);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.stat-pending .num{color:var(--gold)}
.stat-approved .num{color:var(--green)}
.stat-rejected .num{color:var(--red)}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--card);padding:6px;border-radius:var(--radius);box-shadow:var(--shadow)}
.tab{flex:1;padding:10px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-sub);transition:all .2s}
.tab.active{background:var(--blue);color:#fff}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid var(--gray-light);display:flex;align-items:center;gap:10px}
.card-header h3{flex:1;font-size:14px;font-weight:700}
.card-body{padding:16px}
.pending-item{background:var(--card);border:1.5px solid var(--gray-light);border-radius:12px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.pending-item:hover{border-color:var(--blue-light)}
.pending-item .item-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.type-building{background:#dbeafe;color:#1e40af}
.type-faculty{background:#ede9fe;color:#5b21b6}
.pending-item .item-title{font-size:15px;font-weight:700;margin-bottom:4px}
.pending-item .item-meta{font-size:12px;color:var(--text-sub);margin-bottom:10px}
.pending-item .item-actions{display:flex;gap:8px;justify-content:flex-end}

/* ── Data table ── */
.data-list{list-style:none}
.data-item{padding:12px 16px;border-bottom:1px solid var(--gray-light);display:flex;align-items:center;gap:12px}
.data-item:last-child{border-bottom:none}
.data-item .icon{font-size:24px;width:36px;height:36px;background:var(--gray-light);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.data-item .info{flex:1}
.data-item .info h4{font-size:14px;font-weight:700}
.data-item .info p{font-size:12px;color:var(--text-sub)}
.data-item .actions{display:flex;gap:6px}

/* ── Modal ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h2{font-size:18px;font-weight:800;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-sub)}
.empty-state .icon{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:14px}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     LOGIN SCREEN
     ═══════════════════════════════════════════════════════════════ -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🏫</div>
      <h1>CSU-A Admin Panel</h1>
      <p>Campus Information Management System</p>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@csu-a.edu.ph" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     DASHBOARD
     ═══════════════════════════════════════════════════════════════ -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <span class="topbar-title">🏫 CSU-A Admin</span>
    <span class="topbar-role" id="topbar-role"></span>
    <button class="topbar-btn" onclick="doLogout()" title="Sign Out">⏻</button>
  </div>
  <div class="container" id="dashboard-content"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     MODAL (Add/Edit)
     ═══════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add Item</h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-save" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   ADMIN ACCOUNTS
   ================================================================ */
const ADMINS = [
  { email:'superadmin@csu-a.edu.ph', pass:'superadmin123', role:'superadmin', name:'Super Admin (IMS)' },
  { email:'infra@csu-a.edu.ph',      pass:'infra123',     role:'infra',      name:'Infrastructure Admin' },
  { email:'hr@csu-a.edu.ph',         pass:'hr123',        role:'hr',         name:'HR Admin' }
];

/* ================================================================
   STATE
   ================================================================ */
let currentUser = null;
let pendingQueue = [];   // [{id, type, data, submittedBy, submittedAt, status}]
let approvedBuildings = [];
let approvedFaculty = [];

/* ================================================================
   PERSISTENCE (localStorage)
   ================================================================ */
function loadData() {
  pendingQueue = JSON.parse(localStorage.getItem('csua_pending') || '[]');
  approvedBuildings = JSON.parse(localStorage.getItem('csua_buildings') || '[]');
  approvedFaculty = JSON.parse(localStorage.getItem('csua_faculty') || '[]');
}

function saveData() {
  localStorage.setItem('csua_pending', JSON.stringify(pendingQueue));
  localStorage.setItem('csua_buildings', JSON.stringify(approvedBuildings));
  localStorage.setItem('csua_faculty', JSON.stringify(approvedFaculty));
}

/* ================================================================
   AUTH
   ================================================================ */
function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');

  const admin = ADMINS.find(a => a.email === email && a.pass === pass);
  if (!admin) {
    errEl.textContent = 'Invalid email or password';
    errEl.style.display = 'block';
    return;
  }

  currentUser = admin;
  localStorage.setItem('csua_session', JSON.stringify(admin));
  errEl.style.display = 'none';
  showDashboard();
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('csua_session');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

function checkSession() {
  const s = localStorage.getItem('csua_session');
  if (s) {
    currentUser = JSON.parse(s);
    showDashboard();
  }
}

/* ================================================================
   DASHBOARD ROUTER
   ================================================================ */
function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  const roleEl = document.getElementById('topbar-role');
  roleEl.textContent = currentUser.role.replace('super','Super ').toUpperCase();
  roleEl.className = 'topbar-role role-' + currentUser.role;

  loadData();

  if (currentUser.role === 'superadmin') renderSuperAdmin();
  else if (currentUser.role === 'infra') renderInfraAdmin();
  else if (currentUser.role === 'hr') renderHRAdmin();
}

/* ================================================================
   SUPER ADMIN
   ================================================================ */
function renderSuperAdmin() {
  const pending = pendingQueue.filter(p => p.status === 'pending');
  const approved = pendingQueue.filter(p => p.status === 'approved');
  const rejected = pendingQueue.filter(p => p.status === 'rejected');

  let html = `
    <div class="stats-row">
      <div class="stat-card stat-pending"><div class="num">${pending.length}</div><div class="lbl">Pending</div></div>
      <div class="stat-card stat-approved"><div class="num">${approved.length + approvedBuildings.length + approvedFaculty.length}</div><div class="lbl">Approved</div></div>
      <div class="stat-card stat-rejected"><div class="num">${rejected.length}</div><div class="lbl">Rejected</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="superTab('pending',this)">⏳ Pending (${pending.length})</button>
      <button class="tab" onclick="superTab('buildings',this)">🏢 Buildings (${approvedBuildings.length})</button>
      <button class="tab" onclick="superTab('faculty',this)">👨‍🏫 Faculty (${approvedFaculty.length})</button>
    </div>
    <div id="super-tab-content"></div>
  `;

  document.getElementById('dashboard-content').innerHTML = html;
  superTab('pending', document.querySelector('.tab.active'));
}

function superTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const el = document.getElementById('super-tab-content');

  if (tab === 'pending') {
    const pending = pendingQueue.filter(p => p.status === 'pending');
    if (pending.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>No pending items to review</p></div>';
      return;
    }
    el.innerHTML = pending.map(item => {
      const typeLabel = item.type === 'building' ? 'Building / Office' : 'Faculty / Staff';
      const typeClass = item.type === 'building' ? 'type-building' : 'type-faculty';
      let detail = '';
      if (item.type === 'building') {
        const d = item.data;
        detail = `<strong>${d.name}</strong> ${d.icon||''}<br>${d.location||''}<br>GPS: ${d.lat}, ${d.lng}<br>Offices: ${d.offices||'N/A'}`;
      } else {
        const d = item.data;
        detail = `<strong>${d.name}</strong><br>${d.position||''}<br>Department: ${d.department||''}<br>Email: ${d.email||'N/A'}<br>Phone: ${d.phone||'N/A'}`;
      }
      return `
        <div class="pending-item">
          <span class="item-type ${typeClass}">${typeLabel}</span>
          <div class="item-title">${item.type === 'building' ? item.data.name : item.data.name}</div>
          <div class="item-meta">Submitted by ${item.submittedBy} • ${new Date(item.submittedAt).toLocaleString()}</div>
          <div class="item-meta">${detail}</div>
          <div class="item-actions">
            <button class="btn btn-danger btn-sm" onclick="rejectItem('${item.id}')">✕ Reject</button>
            <button class="btn btn-success btn-sm" onclick="approveItem('${item.id}')">✓ Approve</button>
          </div>
        </div>`;
    }).join('');
  }

  if (tab === 'buildings') {
    if (approvedBuildings.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="icon">🏢</div><p>No approved buildings yet</p></div>';
      return;
    }
    el.innerHTML = '<div class="card"><ul class="data-list">' + approvedBuildings.map((b,i) => `
      <li class="data-item">
        <div class="icon">${b.icon || '🏢'}</div>
        <div class="info">
          <h4>${b.name}</h4>
          <p>${b.location || ''} • GPS: ${b.lat}, ${b.lng}</p>
        </div>
        <div class="actions">
          <button class="btn btn-outline btn-sm" onclick="editApprovedBuilding(${i})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="removeApprovedBuilding(${i})">Del</button>
        </div>
      </li>`).join('') + '</ul></div>';
  }

  if (tab === 'faculty') {
    if (approvedFaculty.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="icon">👨‍🏫</div><p>No approved faculty yet</p></div>';
      return;
    }
    el.innerHTML = '<div class="card"><ul class="data-list">' + approvedFaculty.map((f,i) => `
      <li class="data-item">
        <div class="icon">👤</div>
        <div class="info">
          <h4>${f.name}</h4>
          <p>${f.position || ''} • ${f.department || ''}</p>
        </div>
        <div class="actions">
          <button class="btn btn-outline btn-sm" onclick="editApprovedFaculty(${i})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="removeApprovedFaculty(${i})">Del</button>
        </div>
      </li>`).join('') + '</ul></div>';
  }
}

function approveItem(id) {
  const idx = pendingQueue.findIndex(p => p.id === id);
  if (idx === -1) return;
  const item = pendingQueue[idx];
  item.status = 'approved';
  item.approvedAt = Date.now();

  if (item.type === 'building') {
    item.data.approved = true;
    item.data.approvedAt = Date.now();
    approvedBuildings.push(item.data);
  } else if (item.type === 'faculty') {
    item.data.approved = true;
    item.data.approvedAt = Date.now();
    approvedFaculty.push(item.data);
  }

  saveData();
  renderSuperAdmin();
  showToast('Approved: ' + (item.data.name || 'item'));
}

function rejectItem(id) {
  const idx = pendingQueue.findIndex(p => p.id === id);
  if (idx === -1) return;
  pendingQueue[idx].status = 'rejected';
  pendingQueue[idx].rejectedAt = Date.now();
  saveData();
  renderSuperAdmin();
  showToast('Rejected item');
}

function removeApprovedBuilding(i) {
  if (!confirm('Remove ' + approvedBuildings[i].name + '?')) return;
  approvedBuildings.splice(i, 1);
  saveData();
  renderSuperAdmin();
  showToast('Building removed');
}

function removeApprovedFaculty(i) {
  if (!confirm('Remove ' + approvedFaculty[i].name + '?')) return;
  approvedFaculty.splice(i, 1);
  saveData();
  renderSuperAdmin();
  showToast('Faculty removed');
}

function editApprovedBuilding(i) {
  const b = approvedBuildings[i];
  openModal('Edit Building', buildingFormHTML(b), () => {
    const d = readBuildingForm();
    if (!d.name) { showToast('Name is required'); return false; }
    approvedBuildings[i] = d;
    saveData();
    renderSuperAdmin();
    showToast('Building updated');
  });
}

function editApprovedFaculty(i) {
  const f = approvedFaculty[i];
  openModal('Edit Faculty', facultyFormHTML(f), () => {
    const d = readFacultyForm();
    if (!d.name) { showToast('Name is required'); return false; }
    approvedFaculty[i] = d;
    saveData();
    renderSuperAdmin();
    showToast('Faculty updated');
  });
}

/* ================================================================
   INFRA ADMIN
   ================================================================ */
function renderInfraAdmin() {
  const myPending = pendingQueue.filter(p => p.submittedBy === currentUser.email && p.status === 'pending');
  const myApproved = pendingQueue.filter(p => p.submittedBy === currentUser.email && p.status === 'approved');

  let html = `
    <div class="stats-row">
      <div class="stat-card stat-pending"><div class="num">${myPending.length}</div><div class="lbl">Pending Review</div></div>
      <div class="stat-card stat-approved"><div class="num">${myApproved.length}</div><div class="lbl">Approved</div></div>
      <div class="stat-card"><div class="num">${approvedBuildings.length}</div><div class="lbl">Total Buildings</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>🏢 My Submissions</h3>
        <button class="btn btn-primary btn-sm" onclick="openAddBuilding()">+ Add Building</button>
      </div>
      <div id="infra-my-items"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>✅ All Approved Buildings</h3>
      </div>
      <div id="infra-all-items"></div>
    </div>
  `;

  document.getElementById('dashboard-content').innerHTML = html;
  renderInfraItems();
}

function renderInfraItems() {
  const myItems = pendingQueue.filter(p => p.submittedBy === currentUser.email);
  const el = document.getElementById('infra-my-items');
  if (myItems.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No submissions yet. Add a building to get started.</p></div>';
    return;
  }
  el.innerHTML = '<ul class="data-list">' + myItems.map(item => {
    const statusColor = item.status === 'pending' ? 'var(--gold)' : item.status === 'approved' ? 'var(--green)' : 'var(--red)';
    return `
      <li class="data-item">
        <div class="icon">${item.data.icon || '🏢'}</div>
        <div class="info">
          <h4>${item.data.name}</h4>
          <p>${item.data.location || ''} • <span style="color:${statusColor};font-weight:700">${item.status.toUpperCase()}</span></p>
        </div>
      </li>`;
  }).join('') + '</ul>';

  // Also show all approved buildings (read-only)
  const allEl = document.getElementById('infra-all-items');
  if (approvedBuildings.length === 0) {
    allEl.innerHTML = '<div class="empty-state"><div class="icon">🏢</div><p>No buildings approved yet</p></div>';
    return;
  }
  allEl.innerHTML = '<ul class="data-list">' + approvedBuildings.map(b => `
    <li class="data-item">
      <div class="icon">${b.icon || '🏢'}</div>
      <div class="info">
        <h4>${b.name}</h4>
        <p>${b.location || ''} • GPS: ${b.lat}, ${b.lng}</p>
      </div>
    </li>`).join('') + '</ul>';
}

function openAddBuilding() {
  openModal('Add Building / Office', buildingFormHTML(), () => {
    const d = readBuildingForm();
    if (!d.name) { showToast('Name is required'); return false; }
    const item = {
      id: 'b_' + Date.now(),
      type: 'building',
      data: d,
      submittedBy: currentUser.email,
      submittedAt: Date.now(),
      status: 'pending'
    };
    pendingQueue.push(item);
    saveData();
    renderInfraAdmin();
    showToast('Building submitted for approval');
  });
}

/* ================================================================
   HR ADMIN
   ================================================================ */
function renderHRAdmin() {
  const myPending = pendingQueue.filter(p => p.submittedBy === currentUser.email && p.status === 'pending');
  const myApproved = pendingQueue.filter(p => p.submittedBy === currentUser.email && p.status === 'approved');

  let html = `
    <div class="stats-row">
      <div class="stat-card stat-pending"><div class="num">${myPending.length}</div><div class="lbl">Pending Review</div></div>
      <div class="stat-card stat-approved"><div class="num">${myApproved.length}</div><div class="lbl">Approved</div></div>
      <div class="stat-card"><div class="num">${approvedFaculty.length}</div><div class="lbl">Total Faculty</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>👨‍🏫 My Submissions</h3>
        <button class="btn btn-primary btn-sm" onclick="openAddFaculty()">+ Add Faculty</button>
      </div>
      <div id="hr-my-items"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>✅ All Approved Faculty</h3>
      </div>
      <div id="hr-all-items"></div>
    </div>
  `;

  document.getElementById('dashboard-content').innerHTML = html;
  renderHRItems();
}

function renderHRItems() {
  const myItems = pendingQueue.filter(p => p.submittedBy === currentUser.email);
  const el = document.getElementById('hr-my-items');
  if (myItems.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No submissions yet. Add a faculty member to get started.</p></div>';
    return;
  }
  el.innerHTML = '<ul class="data-list">' + myItems.map(item => {
    const statusColor = item.status === 'pending' ? 'var(--gold)' : item.status === 'approved' ? 'var(--green)' : 'var(--red)';
    return `
      <li class="data-item">
        <div class="icon">👤</div>
        <div class="info">
          <h4>${item.data.name}</h4>
          <p>${item.data.position || ''} • <span style="color:${statusColor};font-weight:700">${item.status.toUpperCase()}</span></p>
        </div>
      </li>`;
  }).join('') + '</ul>';

  const allEl = document.getElementById('hr-all-items');
  if (approvedFaculty.length === 0) {
    allEl.innerHTML = '<div class="empty-state"><div class="icon">👨‍🏫</div><p>No faculty approved yet</p></div>';
    return;
  }
  allEl.innerHTML = '<ul class="data-list">' + approvedFaculty.map(f => `
    <li class="data-item">
      <div class="icon">👤</div>
      <div class="info">
        <h4>${f.name}</h4>
        <p>${f.position || ''} • ${f.department || ''}</p>
      </div>
    </li>`).join('') + '</ul>';
}

function openAddFaculty() {
  openModal('Add Faculty / Staff', facultyFormHTML(), () => {
    const d = readFacultyForm();
    if (!d.name) { showToast('Name is required'); return false; }
    const item = {
      id: 'f_' + Date.now(),
      type: 'faculty',
      data: d,
      submittedBy: currentUser.email,
      submittedAt: Date.now(),
      status: 'pending'
    };
    pendingQueue.push(item);
    saveData();
    renderHRAdmin();
    showToast('Faculty submitted for approval');
  });
}

/* ================================================================
   MODAL
   ================================================================ */
let modalSaveFn = null;

function openModal(title, bodyHTML, onSave) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal').classList.add('show');
  modalSaveFn = onSave;
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  modalSaveFn = null;
}

function saveModal() {
  if (modalSaveFn) {
    const result = modalSaveFn();
    if (result !== false) closeModal();
  }
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

/* ================================================================
   EXPORT: Generate kiosk-data.json content
   ================================================================ */
function exportKioskData() {
  const data = {
    buildings: approvedBuildings,
    faculty: approvedFaculty,
    exportedAt: Date.now()
  };
  return JSON.stringify(data, null, 2);
}

// Auto-download on command (for super admin)
function downloadKioskData() {
  const json = exportKioskData();
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kiosk-data.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('kiosk-data.json downloaded');
}

/* ================================================================
   UTILS
   ================================================================ */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// Enter key on login
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  checkSession();
});
</script>
